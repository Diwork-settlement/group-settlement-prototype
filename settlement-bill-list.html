<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的账单 - 合作集团线上结算</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/settlement.css">
</head>
<body>
  <div class="app-layout">
    <aside class="icon-rail">
      <div class="rail-logo">B</div>
      <a class="rail-item" href="index.html" title="首页">⌂</a>
      <a class="rail-item" title="运营">☰</a>
      <a class="rail-item" title="数据">▤</a>
      <a class="rail-item" title="CRM">◎</a>
      <a class="rail-item" title="营销">✦</a>
      <a class="rail-item active" title="财务">¥</a>
    </aside>
    <aside class="sidebar">
      <div class="sidebar-logo">合作集团结算</div>
      <nav class="sidebar-nav">
        <div class="nav-group-title">结算中心</div>
        <a class="nav-sub-item" href="settlement-home.html">结算首页</a>
        <a class="nav-sub-item active" href="settlement-bill-list.html">我的账单</a>
        <a class="nav-sub-item" href="commission-bill-list.html?view=group">佣金账单明细</a>
        <div class="nav-group-title">账户信息</div>
        <a class="nav-sub-item" href="withdraw-account.html">提现账户</a>
        <a class="nav-sub-item" href="invoice-account.html">发票信息</a>
      </nav>
    </aside>

    <div class="main-wrapper">
      <header class="top-header">
        <div class="header-search"><span>🔍</span><input type="text" placeholder="搜索"></div>
        <div class="header-right">
          <select class="header-select"><option>合作集团A</option></select>
          <div class="user-info"><div class="user-avatar">张</div><span>张财务 · 合作集团A</span></div>
        </div>
      </header>

      <main class="page-content">
        <h1 class="page-title">我的账单</h1>
        <p style="font-size:13px;color:var(--text-muted);margin:-4px 0 16px">分佣、一次性、周期性分账推送 · 账期不同不合账 · 不做轧差</p>

        <div class="type-tabs" id="typeTabs"></div>

        <div class="filter-bar">
          <div class="filter-item">
            <span class="filter-label">账期</span>
            <input type="text" class="filter-input" value="2026-01" style="min-width:100px">
            <span style="color:var(--text-muted);align-self:flex-end;padding-bottom:8px">~</span>
            <input type="text" class="filter-input" value="2026-08" style="min-width:100px">
          </div>
          <div class="filter-item">
            <span class="filter-label">对账状态</span>
            <select class="filter-select">
              <option>全部</option>
              <option>待对账</option>
              <option>有异议</option>
              <option>已对账</option>
              <option>已确认</option>
            </select>
          </div>
          <div class="filter-item">
            <span class="filter-label">开票状态</span>
            <select class="filter-select">
              <option>全部</option>
              <option>未开票</option>
              <option>部分开票</option>
              <option>已开票</option>
              <option>待上传</option>
              <option>已上传</option>
            </select>
          </div>
          <div class="filter-item">
            <span class="filter-label">收款状态</span>
            <select class="filter-select">
              <option>全部</option>
              <option>未收款</option>
              <option>部分收款</option>
              <option>已收款</option>
            </select>
          </div>
          <div class="filter-item">
            <span class="filter-label">付款状态</span>
            <select class="filter-select">
              <option>全部</option>
              <option>未付款</option>
              <option>部分付款</option>
              <option>已付款</option>
            </select>
          </div>
          <div class="filter-actions">
            <button class="btn btn-primary">查询</button>
            <button class="btn btn-default">重置</button>
            <button class="btn btn-default" onclick="toast('已导出')">导出</button>
          </div>
        </div>

        <div class="view-only-tip">收付款由丽呈财务操作登记，本端仅查看收款/付款进度；可在账单详情申请开票或上传应付发票（OCR）。</div>

        <div class="table-card table-scroll">
          <table class="data-table" id="billTable"></table>
          <div class="pagination">
            <span style="font-size:12px;color:var(--text-muted);margin-right:8px" id="totalTip">共 — 条</span>
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/settlement.js"></script>
  <script>
    const type = new URLSearchParams(location.search).get('type') || 'all';
    const tabs = [
      { key: 'all', label: '全部' },
      { key: 'commission', label: '分佣 / 分成' },
      { key: 'periodic', label: '周期性费用' },
      { key: 'onetime', label: '一次性费用' },
    ];
    document.getElementById('typeTabs').innerHTML = tabs.map(t =>
      `<a class="type-tab ${type===t.key?'active':''}" href="?type=${t.key}">${t.label}</a>`
    ).join('');

    const allRows = [
      { type: 'commission', typeName: '分佣/分成', no: 'BILL-GA-CM-202608', period: '2026-08', recv: '19,500.00', pay: '23,700.00', got: '0.00', gave: '0.00', recon: ['tag-orange','待对账'], inv: ['tag-orange','未开票'], paySt: ['tag-default','未付款'], recvSt: ['tag-default','未收款'], href: 'settlement-bill-detail.html?type=commission&scenario=pending' },
      { type: 'periodic', typeName: '周期性', no: 'BILL-GA-PD-202608', period: '2026-08', recv: '0.00', pay: '4,500.00', got: '0.00', gave: '0.00', recon: ['tag-blue','已对账'], inv: ['tag-orange','可申请开票'], paySt: ['tag-default','未付款'], recvSt: ['tag-default','—'], href: 'settlement-bill-detail.html?type=periodic&scenario=invoice' },
      { type: 'onetime', typeName: '一次性', no: 'BILL-GA-OT-202608', period: '2026-08', recv: '0.00', pay: '15,000.00', got: '0.00', gave: '15,000.00', recon: ['tag-green','已确认'], inv: ['tag-red','待上传发票'], paySt: ['tag-green','已付款'], recvSt: ['tag-default','—'], href: 'settlement-bill-detail.html?type=onetime&scenario=upload' },
      { type: 'commission', typeName: '分佣/分成', no: 'BILL-GA-CM-202607', period: '2026-07', recv: '20,480.00', pay: '18,420.00', got: '0.00', gave: '0.00', recon: ['tag-red','有异议'], inv: ['tag-default','—'], paySt: ['tag-default','未付款'], recvSt: ['tag-default','未收款'], href: 'settlement-bill-detail.html?type=commission&scenario=dispute' },
      { type: 'periodic', typeName: '周期性', no: 'BILL-GA-PD-202607', period: '2026-07', recv: '0.00', pay: '4,500.00', got: '0.00', gave: '4,500.00', recon: ['tag-green','已确认'], inv: ['tag-green','已开票'], paySt: ['tag-green','已付款'], recvSt: ['tag-default','—'], href: 'settlement-bill-detail.html?type=periodic&scenario=confirmed' },
      { type: 'commission', typeName: '分佣/分成', no: 'BILL-GA-CM-202606', period: '2026-06', recv: '21,050.00', pay: '31,050.00', got: '21,050.00', gave: '31,050.00', recon: ['tag-green','已确认'], inv: ['tag-green','已开票'], paySt: ['tag-green','已付款'], recvSt: ['tag-green','已收款'], href: 'settlement-bill-detail.html?type=commission&scenario=confirmed' },
    ];
    const rows = type === 'all' ? allRows : allRows.filter(r => r.type === type);
    document.getElementById('totalTip').textContent = `共 ${rows.length} 条`;

    document.getElementById('billTable').innerHTML = `
      <thead>
        <tr>
          <th>账单编号</th>
          <th>账单类型</th>
          <th>账期</th>
          <th class="text-right">应收</th>
          <th class="text-right">应付</th>
          <th class="text-right">实收</th>
          <th class="text-right">实付</th>
          <th>对账状态</th>
          <th>开票/发票</th>
          <th>收款</th>
          <th>付款</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td><a href="${r.href}">${r.no}</a></td>
            <td>${r.typeName}</td>
            <td>${r.period}</td>
            <td class="text-right">${r.recv}</td>
            <td class="text-right">${r.pay}</td>
            <td class="text-right">${r.got}</td>
            <td class="text-right">${r.gave}</td>
            <td><span class="tag ${r.recon[0]}">${r.recon[1]}</span></td>
            <td><span class="tag ${r.inv[0]}">${r.inv[1]}</span></td>
            <td><span class="tag ${r.recvSt[0]}">${r.recvSt[1]}</span></td>
            <td><span class="tag ${r.paySt[0]}">${r.paySt[1]}</span></td>
            <td><a class="btn-link" href="${r.href}">查看</a></td>
          </tr>
        `).join('')}
      </tbody>
    `;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发票账户 - 合作集团线上结算</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/settlement.css">
</head>
<body>
  <div class="app-layout">
    <aside class="icon-rail">
      <div class="rail-logo">B</div>
      <a class="rail-item" href="index.html" title="首页">⌂</a>
      <a class="rail-item" title="运营">☰</a>
      <a class="rail-item" title="数据">▤</a>
      <a class="rail-item" title="CRM">◎</a>
      <a class="rail-item" title="营销">✦</a>
      <a class="rail-item active" title="财务">¥</a>
    </aside>
    <aside class="sidebar">
      <div class="sidebar-logo">合作集团结算</div>
      <nav class="sidebar-nav">
        <div class="nav-group-title">结算中心</div>
        <a class="nav-sub-item" href="settlement-home.html">结算首页</a>
        <a class="nav-sub-item" href="settlement-bill-list.html">我的账单</a>
        <a class="nav-sub-item" href="commission-bill-list.html?view=group">佣金账单</a>
        <div class="nav-group-title">账户管理</div>
        <a class="nav-sub-item" href="withdraw-account.html">提现账户</a>
        <a class="nav-sub-item active" href="invoice-account.html">发票账户</a>
      </nav>
    </aside>

    <div class="main-wrapper">
      <header class="top-header">
        <div class="header-search"><span>🔍</span><input type="text" placeholder="搜索"></div>
        <div class="header-right">
          <select class="header-select"><option>合作集团A</option></select>
          <div class="user-info"><div class="user-avatar">张</div><span>张财务 · 合作集团</span></div>
        </div>
      </header>

      <main class="page-content">
        <div class="detail-header">
          <h1 class="page-title">发票信息</h1>
          <div id="headerActions"></div>
        </div>

        <div class="status-banner info" style="margin-bottom:12px">
          <span>ℹ</span>
          <div>开票主体等信息由 OP 在<strong>合作集团维护模块</strong>统一配置（暂不新增 OA 审批）。本页只读查看。申请开票、上传应付发票请在<strong>账单详情</strong>操作。</div>
        </div>

        <div class="scenario-bar">
          <span class="sc-label">场景切换：</span>
          <a href="?scenario=empty">未维护</a>
          <a href="?scenario=pending">待审核</a>
          <a href="?scenario=approved">已审核</a>
          <a href="?scenario=rejected">审核驳回</a>
          <a href="?scenario=edit">编辑中</a>
        </div>

        <div id="statusBanner"></div>

        <form id="invoiceForm" onsubmit="event.preventDefault(); toast('已提交，关键信息变更需丽呈财务审核'); location.href='?scenario=pending'">
          <div class="form-card">
            <div class="form-section-title">开票信息（关键字段变更需重新审核）</div>
            <div class="form-grid">
              <div class="form-item">
                <label><span class="req">*</span>公司名称</label>
                <input type="text" name="company_name" value="合作集团A管理有限公司" data-critical>
              </div>
              <div class="form-item">
                <label><span class="req">*</span>统一社会信用代码</label>
                <input type="text" name="credit_code" value="91310000MA1KXXXXXX" data-critical>
              </div>
              <div class="form-item">
                <label><span class="req">*</span>注册地址</label>
                <input type="text" name="registered_address" value="上海市徐汇区漕溪北路 XXX 号">
              </div>
              <div class="form-item">
                <label><span class="req">*</span>注册电话</label>
                <input type="text" name="registered_phone" value="021-6433XXXX">
              </div>
              <div class="form-item">
                <label><span class="req">*</span>开户银行</label>
                <input type="text" name="bank_name" value="中国工商银行上海分行">
              </div>
              <div class="form-item">
                <label><span class="req">*</span>银行账号</label>
                <input type="text" name="bank_account" value="6222021001XXXXXXXX">
              </div>
              <div class="form-item">
                <label><span class="req">*</span>纳税人资质</label>
                <div class="radio-group" data-critical-group>
                  <label><input type="radio" name="taxpayer_type" value="一般纳税人" checked> 一般纳税人</label>
                  <label><input type="radio" name="taxpayer_type" value="小规模纳税人"> 小规模纳税人</label>
                </div>
              </div>
              <div class="form-item">
                <label><span class="req">*</span>发票类型偏好</label>
                <div class="radio-group">
                  <label><input type="radio" name="invoice_type" value="专票" checked> 增值税专用发票</label>
                  <label><input type="radio" name="invoice_type" value="普票"> 增值税普通发票</label>
                </div>
              </div>
            </div>
          </div>

          <div class="form-card">
            <div class="form-section-title">收票信息（非关键，修改即时生效）</div>
            <div class="form-grid">
              <div class="form-item">
                <label><span class="req">*</span>收件人</label>
                <input type="text" name="receiver_name" value="张财务">
              </div>
              <div class="form-item">
                <label><span class="req">*</span>收件电话</label>
                <input type="text" name="receiver_phone" value="138****5678">
              </div>
              <div class="form-item full">
                <label><span class="req">*</span>收件地址</label>
                <input type="text" name="receiver_address" value="上海市徐汇区漕溪北路 XXX 号 财务部">
              </div>
            </div>
          </div>

          <div class="footer-actions" id="formActions"></div>
        </form>
      </main>
    </div>
  </div>
  <script src="js/settlement.js"></script>
  <script>
    const scenario = getScenario();
    const banner = document.getElementById('statusBanner');
    const actions = document.getElementById('formActions');
    const headerActions = document.getElementById('headerActions');
    const form = document.getElementById('invoiceForm');
    const inputs = form.querySelectorAll('input, select, textarea');

    const banners = {
      empty: ['muted', '尚未维护发票账户，请填写完整信息后提交审核。'],
      pending: ['pending', '发票账户信息已提交，等待丽呈财务运营审核确认。'],
      approved: ['success', '发票账户已审核通过，当前生效中。修改关键信息（公司名称、信用代码、纳税人资质）将触发重新审核。'],
      rejected: ['danger', '审核驳回原因：统一社会信用代码与工商登记信息不一致，请核对后重新提交。'],
      edit: ['info', '编辑模式 · 关键字段变更提交后需重新审核，非关键字段即时生效。'],
    };

    const sc = banners[scenario] || banners.approved;
    banner.innerHTML = `<div class="status-banner ${sc[0]}"><span>●</span><div>${sc[1]}</div></div>`;

    const readonly = ['pending', 'approved'].includes(scenario) || scenario === 'default';
    if (readonly && scenario !== 'edit') {
      inputs.forEach(i => { i.disabled = true; });
      if (scenario === 'pending' || (!scenario || scenario === 'default' || scenario === 'approved')) {
        headerActions.innerHTML = `<button class="btn btn-default" type="button" onclick="location.href='?scenario=edit'">修改信息</button>`;
        actions.innerHTML = '';
      }
    }

    if (scenario === 'empty' || scenario === 'rejected' || scenario === 'edit') {
      inputs.forEach(i => { i.disabled = false; });
      if (scenario === 'empty') {
        form.querySelectorAll('input[type="text"]').forEach(i => i.value = '');
        form.querySelectorAll('input[type="radio"]').forEach(i => i.checked = false);
      }
      actions.innerHTML = `
        <button class="btn btn-default" type="button" onclick="history.back()">取消</button>
        <button class="btn btn-primary" type="submit">提交审核</button>
      `;
    }
  </script>
</body>
</html>

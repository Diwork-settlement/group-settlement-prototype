<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>佣金账单 - 合作集团线上结算</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/settlement.css">
</head>
<body>
  <div class="app-layout">
    <aside class="icon-rail">
      <div class="rail-logo">B</div>
      <a class="rail-item" href="index.html" title="首页">⌂</a>
      <a class="rail-item" title="运营">☰</a>
      <a class="rail-item" title="数据">▤</a>
      <a class="rail-item" title="CRM">◎</a>
      <a class="rail-item" title="营销">✦</a>
      <a class="rail-item active" title="财务">¥</a>
    </aside>
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-wrapper">
      <header class="top-header">
        <div class="header-search"><span>🔍</span><input type="text" placeholder="搜索"></div>
        <div class="header-right">
          <select class="header-select" id="headerRole"></select>
          <div class="user-info"><div class="user-avatar" id="avatar">马</div><span id="userName">马敏 · 丽呈财务</span></div>
        </div>
      </header>

      <main class="page-content">
        <h1 class="page-title">佣金账单</h1>
        <p style="font-size:13px;color:var(--text-muted);margin:-4px 0 16px">每日分别生成<strong>客房分佣</strong>与<strong>营销分佣</strong>日账单 · 明细拆分应收 / 应付</p>

        <div class="scenario-bar">
          <span class="sc-label">视角切换：</span>
          <a href="?view=lcc">丽呈财务（含合作集团列）</a>
          <a href="?view=group">合作集团（无合作集团列）</a>
        </div>

        <div class="filter-bar" id="filterBar"></div>

        <div class="type-tabs" style="margin-bottom:12px">
          <a class="type-tab active" href="javascript:;" data-biz="all">全部</a>
          <a class="type-tab" href="javascript:;" data-biz="room">客房分佣</a>
          <a class="type-tab" href="javascript:;" data-biz="mkt">营销分佣</a>
        </div>

        <div class="table-card table-scroll">
          <table class="data-table" id="billTable"></table>
          <div class="pagination">
            <span style="font-size:12px;color:var(--text-muted);margin-right:8px" id="totalCount">共 — 条</span>
            <select style="height:28px;border:1px solid var(--border);border-radius:4px;font-size:12px">
              <option>20条/页</option>
            </select>
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">›</button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/settlement.js"></script>
  <script>
    const view = new URLSearchParams(location.search).get('view') || 'lcc';
    const isGroup = view === 'group';
    let bizFilter = 'all';

    document.getElementById('sidebar').innerHTML = isGroup ? `
      <div class="sidebar-logo">合作集团结算</div>
      <nav class="sidebar-nav">
        <div class="nav-group-title">结算中心</div>
        <a class="nav-sub-item" href="settlement-home.html">结算首页</a>
        <a class="nav-sub-item" href="settlement-bill-list.html">我的账单</a>
        <a class="nav-sub-item active" href="commission-bill-list.html?view=group">佣金账单明细</a>
        <div class="nav-group-title">账户信息</div>
        <a class="nav-sub-item" href="withdraw-account.html">提现账户</a>
        <a class="nav-sub-item" href="invoice-account.html">发票信息</a>
      </nav>
    ` : `
      <div class="sidebar-logo">合作集团结算</div>
      <nav class="sidebar-nav">
        <div class="nav-group-title">丽呈财务</div>
        <a class="nav-sub-item" href="lcc-workbench.html">结算工作台</a>
        <a class="nav-sub-item" href="lcc-bill-list.html">账单管理</a>
        <a class="nav-sub-item active" href="commission-bill-list.html?view=lcc">佣金账单明细</a>
        <a class="nav-sub-item" href="lcc-invoice-review.html">发票审核</a>
      </nav>
    `;

    document.getElementById('headerRole').innerHTML = isGroup ? '<option>合作集团A</option>' : '<option>Business</option>';
    document.getElementById('avatar').textContent = isGroup ? '张' : '马';
    document.getElementById('userName').textContent = isGroup ? '张财务 · 合作集团A' : '马敏 · 丽呈财务';

    document.getElementById('filterBar').innerHTML = `
      ${isGroup ? '' : `
      <div class="filter-item">
        <span class="filter-label">合作集团</span>
        <select class="filter-select"><option>请选择合作集团</option><option>合作集团A</option><option>合作集团B</option></select>
      </div>`}
      <div class="filter-item">
        <span class="filter-label">账单日期</span>
        <input type="text" class="filter-input" value="2026-07-01" style="min-width:110px">
        <span style="color:var(--text-muted);align-self:flex-end;padding-bottom:8px">~</span>
        <input type="text" class="filter-input" value="2026-07-31" style="min-width:110px">
      </div>
      <div class="filter-item">
        <span class="filter-label">业务类型</span>
        <select class="filter-select" id="bizSelect">
          <option value="all">全部</option>
          <option value="room">客房分佣</option>
          <option value="mkt">营销分佣</option>
        </select>
      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" onclick="renderTable()">查询</button>
        <button class="btn btn-default">重置</button>
        <button class="btn btn-default" onclick="toast('已开始下载')">下载账单</button>
      </div>
    `;

    // 每日生成：客房分佣 + 营销分佣
    const allRows = [
      { date: '2026-07-31', group: '合作集团A', biz: 'room', bizName: '客房分佣', recv: '1,280.00', pay: '2,150.00' },
      { date: '2026-07-31', group: '合作集团A', biz: 'mkt', bizName: '营销分佣', recv: '420.00', pay: '680.00' },
      { date: '2026-07-30', group: '合作集团A', biz: 'room', bizName: '客房分佣', recv: '980.00', pay: '1,640.00' },
      { date: '2026-07-30', group: '合作集团A', biz: 'mkt', bizName: '营销分佣', recv: '310.00', pay: '520.00' },
      { date: '2026-07-29', group: '合作集团B', biz: 'room', bizName: '客房分佣', recv: '2,100.00', pay: '3,200.00' },
      { date: '2026-07-29', group: '合作集团B', biz: 'mkt', bizName: '营销分佣', recv: '560.00', pay: '890.00' },
      { date: '2026-07-28', group: '合作集团A', biz: 'room', bizName: '客房分佣', recv: '1,450.00', pay: '1,980.00' },
      { date: '2026-07-28', group: '合作集团A', biz: 'mkt', bizName: '营销分佣', recv: '0.00', pay: '120.00' },
      { date: '2026-07-27', group: '合作集团C', biz: 'room', bizName: '客房分佣', recv: '760.00', pay: '1,100.00' },
      { date: '2026-07-27', group: '合作集团C', biz: 'mkt', bizName: '营销分佣', recv: '230.00', pay: '410.00' },
    ];

    function renderTable() {
      const bizSel = document.getElementById('bizSelect');
      if (bizSel) bizFilter = bizSel.value;
      let rows = allRows.filter(r => (bizFilter === 'all' || r.biz === bizFilter));
      if (isGroup) rows = rows.filter(r => r.group === '合作集团A');

      document.getElementById('totalCount').textContent = `共 ${rows.length} 条`;
      document.querySelectorAll('.type-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.biz === bizFilter);
      });

      document.getElementById('billTable').innerHTML = `
        <thead>
          <tr>
            <th>账单日期</th>
            ${isGroup ? '' : '<th>合作集团</th>'}
            <th>业务类型</th>
            <th class="text-right">应收合计</th>
            <th class="text-right">应付合计</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => {
            const href = `commission-bill-detail.html?view=${view}&date=${r.date}&biz=${r.biz}`;
            return `<tr>
              <td>${r.date}</td>
              ${isGroup ? '' : `<td>${r.group}</td>`}
              <td><span class="tag ${r.biz==='room'?'tag-blue':'tag-purple'}">${r.bizName}</span></td>
              <td class="text-right">${r.recv}</td>
              <td class="text-right">${r.pay}</td>
              <td><a class="btn-link" href="${href}">查看详情</a></td>
            </tr>`;
          }).join('')}
        </tbody>
      `;
    }

    document.querySelectorAll('.type-tab').forEach(t => {
      t.addEventListener('click', () => {
        bizFilter = t.dataset.biz;
        const sel = document.getElementById('bizSelect');
        if (sel) sel.value = bizFilter;
        renderTable();
      });
    });

    renderTable();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账户信息 - 财务配置</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/settlement.css">
  <style>
    .entity-select-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .entity-select-bar label {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
    }
    .entity-select-bar select {
      min-width: 280px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 10px;
      font-size: 13px;
      color: var(--text);
      background: #fff;
    }
    .acct-panel { display: none; }
    .acct-panel.active { display: block; }
    .acct-form-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 720px;
    }
    .acct-form-row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 16px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .acct-form-row:last-child { border-bottom: none; }
    .acct-form-row > label {
      font-size: 13px;
      color: var(--text);
      text-align: right;
    }
    .acct-form-row > label .req {
      color: var(--danger);
      margin-right: 2px;
    }
    .acct-form-row input,
    .acct-form-row select,
    .acct-form-row textarea {
      width: 100%;
      max-width: 420px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 10px;
      font-size: 13px;
      color: var(--text);
      background: #fff;
    }
    .acct-form-row textarea {
      height: auto;
      min-height: 64px;
      padding: 8px 10px;
      resize: vertical;
    }
    .acct-form-row .radio-group {
      display: flex;
      gap: 24px;
      align-items: center;
      height: 32px;
    }
    .acct-form-row .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }
    .scene-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 480px;
    }
    .scene-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      color: var(--text);
      background: #fafafa;
      cursor: pointer;
      user-select: none;
    }
    .scene-tag.active {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }
    .scene-tag input { display: none; }
    .panel-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="icon-rail">
      <div class="rail-logo">B</div>
      <a class="rail-item" href="index.html" title="首页">⌂</a>
      <a class="rail-item" title="运营">☰</a>
      <a class="rail-item" title="数据">▤</a>
      <a class="rail-item" title="CRM">◎</a>
      <a class="rail-item" title="营销">✦</a>
      <a class="rail-item active" title="财务">¥</a>
    </aside>
    <aside class="sidebar">
      <div class="sidebar-logo">business</div>
      <nav class="sidebar-nav">
        <div class="nav-group-title">费用管理</div>
        <a class="nav-sub-item" href="lcc-workbench.html">分佣账单</a>
        <a class="nav-sub-item" href="lcc-bill-list.html">账单管理</a>
        <div class="nav-group-title">财务配置</div>
        <a class="nav-sub-item active" href="lcc-group-account.html">账户信息</a>
      </nav>
    </aside>

    <div class="main-wrapper">
      <header class="top-header">
        <div class="header-search"><span>🔍</span><input type="text" placeholder="搜索"></div>
        <div class="header-right">
          <select class="header-select"><option>Business</option></select>
          <div class="user-info"><div class="user-avatar">马</div><span>马敏 · 丽呈财务</span></div>
        </div>
      </header>

      <main class="page-content">
        <div class="detail-header">
          <div>
            <h1 class="page-title">账户信息</h1>
          </div>
        </div>

        <div class="type-tabs" id="entityTabs" style="margin-bottom:16px">
          <a class="type-tab" href="#" data-entity="hotel" onclick="return switchEntity('hotel')">酒店</a>
          <a class="type-tab active" href="#" data-entity="group" onclick="return switchEntity('group')">合作集团</a>
        </div>

        <div id="hotelScope" style="display:none">
          <div class="entity-select-bar">
            <label>选择酒店</label>
            <select>
              <option>丽江古城大水车四合院丽歌丽呈酒店</option>
            </select>
          </div>
          <div class="type-tabs" style="margin-bottom:0;border-radius:4px 4px 0 0">
            <a class="type-tab active" href="#" onclick="return switchHotelTab('account')">账户信息</a>
            <a class="type-tab" href="#" onclick="return switchHotelTab('invoice')">开票信息</a>
          </div>
          <div class="form-card acct-panel active" id="hotelAccount" style="border-radius:0 0 4px 4px;margin-top:0">
            <div class="acct-form-list">
              <div class="acct-form-row"><label><span class="req">*</span>开户行名称</label><input value="招商银行" readonly></div>
              <div class="acct-form-row"><label><span class="req">*</span>开户行所在城市</label><input value="丽江市" readonly></div>
              <div class="acct-form-row"><label><span class="req">*</span>开户行支行</label><input value="招商银行丽江古城支行" readonly></div>
              <div class="acct-form-row"><label><span class="req">*</span>开户行联行号</label><input value="308731000018" readonly></div>
              <div class="acct-form-row"><label><span class="req">*</span>收款单位/人</label><input value="丽江丽歌假日酒店有限公司" readonly></div>
              <div class="acct-form-row"><label><span class="req">*</span>收款单位/人账号</label><input value="888900022610703" readonly></div>
            </div>
          </div>
          <div class="form-card acct-panel" id="hotelInvoice" style="border-radius:0 0 4px 4px;margin-top:0">
            <div class="acct-form-list">
              <div class="acct-form-row"><label><span class="req">*</span>发票抬头</label><input value="丽江丽歌假日酒店有限公司" readonly></div>
              <div class="acct-form-row"><label><span class="req">*</span>纳税人识别号</label><input value="915307005718734461" readonly></div>
              <div class="acct-form-row"><label><span class="req">*</span>开户行</label><input value="招商银行" readonly></div>
              <div class="acct-form-row"><label><span class="req">*</span>银行账号</label><input value="888900022610703" readonly></div>
              <div class="acct-form-row"><label><span class="req">*</span>适用场景</label><input value="品牌技术服务费、系统维护费、订单服务费" readonly></div>
            </div>
          </div>
        </div>

        <div id="groupScope">
        <div class="entity-select-bar">
          <label>选择合作集团</label>
          <select id="groupSelect" onchange="switchGroup()">
            <option value="A">合作集团A</option>
            <option value="B">合作集团B</option>
            <option value="C">合作集团C</option>
            <option value="empty">合作集团D（未维护）</option>
          </select>
        </div>

        <div class="type-tabs" style="margin-bottom:0;border-radius:4px 4px 0 0">
          <a class="type-tab active" href="#" data-tab="account" onclick="return switchTab('account')">账户信息</a>
          <a class="type-tab" href="#" data-tab="invoice" onclick="return switchTab('invoice')">开票信息</a>
        </div>

        <!-- 账户信息 = 收款信息 -->
        <div class="form-card acct-panel active" id="panelAccount" style="border-radius:0 0 4px 4px;margin-top:0">
          <div class="status-banner info" style="margin-bottom:12px">
            <span>ℹ</span>
            <div>收款信息用于丽呈向合作集团付款。字段对齐酒店「账户信息」；本页由丽呈财务维护，合作集团端只读。</div>
          </div>
          <div class="form-section-title">收款信息</div>
          <div class="acct-form-list">
            <div class="acct-form-row">
              <label><span class="req">*</span>开户行名称</label>
              <input id="bankName" type="text" placeholder="请输入开户行名称">
            </div>
            <div class="acct-form-row">
              <label><span class="req">*</span>开户行所在城市</label>
              <input id="bankCity" type="text" placeholder="请输入开户行所在城市">
            </div>
            <div class="acct-form-row">
              <label><span class="req">*</span>开户行支行</label>
              <input id="bankBranch" type="text" placeholder="请输入开户行支行">
            </div>
            <div class="acct-form-row">
              <label><span class="req">*</span>开户行联行号</label>
              <input id="bankCnaps" type="text" placeholder="请输入开户行联行号">
            </div>
            <div class="acct-form-row">
              <label><span class="req">*</span>收款单位/人</label>
              <input id="payeeName" type="text" placeholder="请输入收款单位/人">
            </div>
            <div class="acct-form-row">
              <label><span class="req">*</span>收款单位/人账号</label>
              <input id="payeeAccount" type="text" placeholder="请输入收款账号">
            </div>
          </div>
          <div class="panel-actions">
            <button class="btn btn-default" type="button" onclick="resetAccount()">重置</button>
            <button class="btn btn-primary" type="button" onclick="saveAccount()">保存</button>
          </div>
        </div>

        <!-- 开票信息 -->
        <div class="form-card acct-panel" id="panelInvoice" style="border-radius:0 0 4px 4px;margin-top:0">
          <div class="status-banner info" style="margin-bottom:12px">
            <span>ℹ</span>
            <div>开票信息用于丽呈向合作集团开具发票。字段对齐酒店「开票信息」；适用场景按合作集团佣金结算配置。</div>
          </div>

          <div class="form-section-title">开票信息</div>
          <div class="acct-form-list">
            <div class="acct-form-row">
              <label><span class="req">*</span>是否要求提供专票</label>
              <div class="radio-group">
                <label><input type="radio" name="invType" value="special" checked> 专票</label>
                <label><input type="radio" name="invType" value="normal"> 普票</label>
              </div>
            </div>
            <div class="acct-form-row">
              <label><span class="req">*</span>发票抬头</label>
              <input id="invTitle" type="text" placeholder="请输入发票抬头">
            </div>
            <div class="acct-form-row">
              <label><span class="req">*</span>纳税人识别号</label>
              <input id="invTaxNo" type="text" placeholder="请输入纳税人识别号">
            </div>
            <div class="acct-form-row">
              <label><span class="req">*</span>开户行</label>
              <input id="invBank" type="text" placeholder="请输入开户行">
            </div>
            <div class="acct-form-row">
              <label><span class="req">*</span>银行账号</label>
              <input id="invBankAccount" type="text" placeholder="请输入银行账号">
            </div>
            <div class="acct-form-row">
              <label><span class="req">*</span>公司地址</label>
              <input id="invAddress" type="text" placeholder="请输入公司地址">
            </div>
            <div class="acct-form-row">
              <label><span class="req">*</span>公司电话</label>
              <input id="invPhone" type="text" placeholder="请输入公司电话">
            </div>
            <div class="acct-form-row">
              <label><span class="req">*</span>适用场景</label>
              <div class="scene-tags" id="sceneTags">
                <label class="scene-tag active"><input type="checkbox" value="客房分佣" checked> 客房分佣</label>
                <label class="scene-tag active"><input type="checkbox" value="营销分佣" checked> 营销分佣</label>
                <label class="scene-tag"><input type="checkbox" value="订单服务费"> 订单服务费</label>
              </div>
            </div>
            <div class="acct-form-row">
              <label>开票备注项</label>
              <input id="invRemark" type="text" placeholder="如：账期-费项名称">
            </div>
          </div>

          <div class="form-section-title" style="margin-top:24px">合作集团邮寄信息</div>
          <div class="acct-form-list">
            <div class="acct-form-row">
              <label>收件地址</label>
              <input id="mailAddress" type="text" placeholder="请输入收件地址">
            </div>
            <div class="acct-form-row">
              <label>收件人</label>
              <input id="mailReceiver" type="text" placeholder="请输入收件人">
            </div>
            <div class="acct-form-row">
              <label>联系电话</label>
              <input id="mailPhone" type="text" placeholder="请输入联系电话">
            </div>
          </div>

          <div class="panel-actions">
            <button class="btn btn-default" type="button" onclick="resetInvoice()">重置</button>
            <button class="btn btn-primary" type="button" onclick="saveInvoice()">保存</button>
          </div>
        </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/settlement.js"></script>
  <script>
    const groupData = {
      A: {
        account: {
          bankName: '招商银行',
          bankCity: '上海市',
          bankBranch: '招商银行上海徐汇支行',
          bankCnaps: '308290003016',
          payeeName: '合作集团A管理有限公司',
          payeeAccount: '1219384726501',
        },
        invoice: {
          invType: 'special',
          invTitle: '合作集团A管理有限公司',
          invTaxNo: '91310000MA1KXXXXXX',
          invBank: '招商银行',
          invBankAccount: '1219384726501',
          invAddress: '上海市徐汇区漕溪北路 XXX 号',
          invPhone: '021-88886666',
          scenes: ['客房分佣', '营销分佣'],
          invRemark: '账期-费项名称',
          mailAddress: '上海市徐汇区漕溪北路 XXX 号 财务部',
          mailReceiver: '张财务',
          mailPhone: '13800001111',
        }
      },
      B: {
        account: {
          bankName: '中国工商银行',
          bankCity: '北京市',
          bankBranch: '中国工商银行北京朝阳支行',
          bankCnaps: '102100000021',
          payeeName: '合作集团B酒店管理有限公司',
          payeeAccount: '0200296409200012345',
        },
        invoice: {
          invType: 'normal',
          invTitle: '合作集团B酒店管理有限公司',
          invTaxNo: '91110000MA01YYYYYY',
          invBank: '中国工商银行',
          invBankAccount: '0200296409200012345',
          invAddress: '北京市朝阳区建国路 XX 号',
          invPhone: '010-66668888',
          scenes: ['客房分佣', '营销分佣', '订单服务费'],
          invRemark: '账期-费项名称',
          mailAddress: '北京市朝阳区建国路 XX 号',
          mailReceiver: '李会计',
          mailPhone: '13900002222',
        }
      },
      C: {
        account: {
          bankName: '中国建设银行',
          bankCity: '广州市',
          bankBranch: '中国建设银行广州天河支行',
          bankCnaps: '105581000012',
          payeeName: '合作集团C商业管理有限公司',
          payeeAccount: '44050161730800001234',
        },
        invoice: {
          invType: 'special',
          invTitle: '合作集团C商业管理有限公司',
          invTaxNo: '91440000MA5CZZZZZZ',
          invBank: '中国建设银行',
          invBankAccount: '44050161730800001234',
          invAddress: '广州市天河区体育西路 XX 号',
          invPhone: '020-38886666',
          scenes: ['客房分佣'],
          invRemark: '账期-费项名称',
          mailAddress: '广州市天河区体育西路 XX 号',
          mailReceiver: '王财务',
          mailPhone: '13700003333',
        }
      },
      empty: {
        account: {
          bankName: '', bankCity: '', bankBranch: '', bankCnaps: '', payeeName: '', payeeAccount: ''
        },
        invoice: {
          invType: 'special',
          invTitle: '', invTaxNo: '', invBank: '', invBankAccount: '',
          invAddress: '', invPhone: '', scenes: [], invRemark: '',
          mailAddress: '', mailReceiver: '', mailPhone: ''
        }
      }
    };

    let currentGroup = 'A';

    document.querySelectorAll('#sceneTags .scene-tag').forEach(tag => {
      tag.addEventListener('click', (e) => {
        e.preventDefault();
        const input = tag.querySelector('input');
        input.checked = !input.checked;
        tag.classList.toggle('active', input.checked);
      });
    });

    function switchTab(tab) {
      document.querySelectorAll('.type-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      document.getElementById('panelAccount').classList.toggle('active', tab === 'account');
      document.getElementById('panelInvoice').classList.toggle('active', tab === 'invoice');
      return false;
    }

    function fillAccount(data) {
      document.getElementById('bankName').value = data.bankName || '';
      document.getElementById('bankCity').value = data.bankCity || '';
      document.getElementById('bankBranch').value = data.bankBranch || '';
      document.getElementById('bankCnaps').value = data.bankCnaps || '';
      document.getElementById('payeeName').value = data.payeeName || '';
      document.getElementById('payeeAccount').value = data.payeeAccount || '';
    }

    function fillInvoice(data) {
      document.querySelectorAll('input[name="invType"]').forEach(r => {
        r.checked = r.value === (data.invType || 'special');
      });
      document.getElementById('invTitle').value = data.invTitle || '';
      document.getElementById('invTaxNo').value = data.invTaxNo || '';
      document.getElementById('invBank').value = data.invBank || '';
      document.getElementById('invBankAccount').value = data.invBankAccount || '';
      document.getElementById('invAddress').value = data.invAddress || '';
      document.getElementById('invPhone').value = data.invPhone || '';
      document.getElementById('invRemark').value = data.invRemark || '';
      document.getElementById('mailAddress').value = data.mailAddress || '';
      document.getElementById('mailReceiver').value = data.mailReceiver || '';
      document.getElementById('mailPhone').value = data.mailPhone || '';
      const scenes = data.scenes || [];
      document.querySelectorAll('#sceneTags .scene-tag').forEach(tag => {
        const input = tag.querySelector('input');
        const on = scenes.includes(input.value);
        input.checked = on;
        tag.classList.toggle('active', on);
      });
    }

    function switchGroup() {
      currentGroup = document.getElementById('groupSelect').value;
      const data = groupData[currentGroup];
      fillAccount(data.account);
      fillInvoice(data.invoice);
    }

    function resetAccount() {
      fillAccount(groupData[currentGroup].account);
      toast('已重置为最近保存内容');
    }

    function resetInvoice() {
      fillInvoice(groupData[currentGroup].invoice);
      toast('已重置为最近保存内容');
    }

    function saveAccount() {
      const required = ['bankName', 'bankCity', 'bankBranch', 'bankCnaps', 'payeeName', 'payeeAccount'];
      if (required.some(id => !document.getElementById(id).value.trim())) {
        toast('请完整填写必填项');
        return;
      }
      groupData[currentGroup].account = {
        bankName: document.getElementById('bankName').value.trim(),
        bankCity: document.getElementById('bankCity').value.trim(),
        bankBranch: document.getElementById('bankBranch').value.trim(),
        bankCnaps: document.getElementById('bankCnaps').value.trim(),
        payeeName: document.getElementById('payeeName').value.trim(),
        payeeAccount: document.getElementById('payeeAccount').value.trim(),
      };
      toast('收款信息已保存');
    }

    function saveInvoice() {
      const required = ['invTitle', 'invTaxNo', 'invBank', 'invBankAccount', 'invAddress', 'invPhone'];
      if (required.some(id => !document.getElementById(id).value.trim())) {
        toast('请完整填写必填项');
        return;
      }
      const scenes = [...document.querySelectorAll('#sceneTags input:checked')].map(i => i.value);
      if (!scenes.length) {
        toast('请至少选择一个适用场景');
        return;
      }
      groupData[currentGroup].invoice = {
        invType: document.querySelector('input[name="invType"]:checked').value,
        invTitle: document.getElementById('invTitle').value.trim(),
        invTaxNo: document.getElementById('invTaxNo').value.trim(),
        invBank: document.getElementById('invBank').value.trim(),
        invBankAccount: document.getElementById('invBankAccount').value.trim(),
        invAddress: document.getElementById('invAddress').value.trim(),
        invPhone: document.getElementById('invPhone').value.trim(),
        scenes,
        invRemark: document.getElementById('invRemark').value.trim(),
        mailAddress: document.getElementById('mailAddress').value.trim(),
        mailReceiver: document.getElementById('mailReceiver').value.trim(),
        mailPhone: document.getElementById('mailPhone').value.trim(),
      };
      toast('开票信息已保存');
    }

    const tab = new URLSearchParams(location.search).get('tab');
    if (tab === 'invoice') switchTab('invoice');
    switchGroup();

    window.switchEntity = function (entity) {
      document.querySelectorAll('#entityTabs .type-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.entity === entity);
      });
      document.getElementById('hotelScope').style.display = entity === 'hotel' ? '' : 'none';
      document.getElementById('groupScope').style.display = entity === 'group' ? '' : 'none';
      return false;
    };
    window.switchHotelTab = function (tab) {
      document.getElementById('hotelAccount').classList.toggle('active', tab === 'account');
      document.getElementById('hotelInvoice').classList.toggle('active', tab === 'invoice');
      return false;
    };
    if (new URLSearchParams(location.search).get('entity') === 'hotel') switchEntity('hotel');
  </script>
